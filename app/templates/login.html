<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 · AI-GEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:360px;margin-top:12vh">
  <h4 class="mb-3 text-center">AI-GEO 内容监控</h4>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card card-body">
    <input class="form-control mb-2" name="username" placeholder="用户名" required autofocus>
    <input class="form-control mb-3" type="password" name="password" placeholder="密码" required>
    <button class="btn btn-primary">登录</button>
  </form>
</div>
</body>
</html>
