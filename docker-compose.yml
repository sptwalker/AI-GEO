# AI-GEO MVP 一键起：MySQL + 应用
# 使用：cp .env.example .env 改好密钥后 `docker compose up -d`
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pwd}
      MYSQL_DATABASE: ${DB_NAME:-ai_geo}
      MYSQL_USER: ${DB_USER:-ai_geo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ai_geo_pwd}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql          # 容器内连库用服务名，覆盖 .env 里的 127.0.0.1
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  mysql_data:
